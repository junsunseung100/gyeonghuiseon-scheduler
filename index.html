<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>경희선한의원 · 문진일정 달력</title>
    <style>
      :root { --blue:#2b6cb0; --green:#2f855a; --brown:#8a6d3b; --red:#c53030; --gold:#b7791f; --purple:#6b46c1; --line:#e2e8f0; }
      * { box-sizing: border-box; }
      body { margin:0; font-family: system-ui, "Malgun Gothic", sans-serif; color:#1a202c; background:#f7fafc; }
      header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:#fff; border-bottom:1px solid var(--line); }
      header h1 { font-size:16px; margin:0; }
      #userbar { margin-left:auto; font-size:13px; color:#4a5568; display:flex; gap:8px; align-items:center; }
      nav#tabs { display:flex; gap:4px; padding:8px 16px; background:#fff; border-bottom:1px solid var(--line); flex-wrap:wrap; }
      nav#tabs button { border:1px solid var(--line); background:#fff; padding:6px 12px; border-radius:8px; cursor:pointer; font-size:14px; }
      nav#tabs button.active { background:#1a202c; color:#fff; border-color:#1a202c; }
      main#view { padding:16px; max-width:none; width:100%; }
      button { font-family:inherit; }
      .btn { border:1px solid var(--line); background:#fff; border-radius:6px; padding:4px 8px; cursor:pointer; font-size:12px; margin:2px 2px 2px 0; }
      .btn.primary { background:var(--green); color:#fff; border-color:var(--green); }
      .card { border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; background:#fff; }
      .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
      input, select { font-family:inherit; font-size:14px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; }
      .chip { display:inline-block; font-size:11px; padding:1px 6px; border-radius:6px; color:#fff; margin:1px; }
      table.cal { width:100%; border-collapse:collapse; table-layout:fixed; }
      table.cal th:first-child, table.cal td:first-child { width:7%; }
      table.cal th { font-size:12px; color:#718096; padding:4px; }
      .today3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; align-items:start; }
      .today3 .todaycol { min-width:0; }
      .today3 h3 { margin:0 0 8px; }
      @media (max-width:700px) { .today3 { grid-template-columns:1fr; } }
      table.cal td { border:1px solid var(--line); vertical-align:top; height:184px; width:14.2%; padding:3px; font-size:12px; cursor:pointer; }
      table.cal td:hover { background:#eef6ff; }
      td.closed { background:#f1f1f4; }
      td.today { outline:2px solid var(--blue); }
      .daynum { font-weight:700; font-size:13px; margin-bottom:2px; }
      .cellbox { max-height:150px; overflow-y:auto; }
      .cellbox::-webkit-scrollbar { width:6px; }
      .cellbox::-webkit-scrollbar-thumb { background:#cbd5e0; border-radius:3px; }
      table.cal .chip { display:block; font-size:12px; font-weight:600; padding:2px 6px; margin:2px 0; white-space:normal; word-break:break-all; line-height:1.25; }
      .cellcount { font-size:10px; color:#718096; }
      .holiday { color:var(--red); font-size:10px; }
      .badge { font-size:10px; background:#edf2f7; border-radius:4px; padding:0 4px; margin-left:4px; }
      .muted { color:#718096; font-size:12px; }
      .task { border:1px solid var(--line); border-radius:8px; padding:8px; margin-bottom:6px; }
      .task.overdue { border-color:var(--red); }
      h3 { margin:16px 0 8px; font-size:15px; }
      table.tbl { width:100%; border-collapse:collapse; margin-bottom:12px; }
      table.tbl th, table.tbl td { border:1px solid var(--line); padding:6px 10px; font-size:13px; text-align:left; }
      table.tbl th { background:#f7fafc; }
      label.field { display:flex; flex-direction:column; gap:4px; font-size:12px; color:#4a5568; }
      #login { max-width:340px; margin:60px auto; }
      #modal { position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; align-items:center; justify-content:center; z-index:50; }
      #modal.open { display:flex; }
      .modal-box { background:#fff; border-radius:12px; padding:18px; width:360px; max-width:92vw; }
      .modal-box h3 { margin:0 0 10px; }
      /* 압축 달력 항목(색 점 + 글) */
      table.cal .calchip { display:block; font-size:12px; padding:1px 4px 1px 2px; margin:1px 0; line-height:1.25; white-space:normal; word-break:break-all; border-radius:4px; color:#1a202c; }
      table.cal .calchip::before { content:""; display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--dot,#888); margin-right:5px; vertical-align:middle; }
      table.cal .calchip.done { color:#a0aec0; text-decoration:line-through; }
      table.cal .calchip.done::before { background:#a0aec0; }
      /* 달력 필터 바 */
      .filterbar { flex-wrap:wrap; gap:4px; align-items:center; }
      .fchip { display:inline-flex; align-items:center; gap:5px; font-size:12px; padding:3px 8px; }
      .fchip.off { opacity:.4; text-decoration:line-through; }
      .fdot { width:9px; height:9px; border-radius:50%; display:inline-block; }
      /* 대시보드: 긴급 밴드 */
      .band { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
      .alertcard { flex:1 1 140px; min-width:130px; border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:#fff; cursor:pointer; }
      .alertcard .an { font-size:24px; font-weight:800; line-height:1; }
      .alertcard .al { font-size:12px; color:#718096; margin-top:3px; }
      .alertcard.red { border-color:#fca5a5; background:#fef2f2; } .alertcard.red .an { color:var(--red); }
      .alertcard.amber { border-color:#fcd34d; background:#fffbeb; } .alertcard.amber .an { color:var(--gold); }
      /* 대시보드: 단계 카드 */
      .steps { display:flex; flex-direction:column; gap:8px; }
      .stepcard { background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
      .shead { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
      .snum { width:24px; height:24px; border-radius:7px; color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center; font-size:13px; flex:0 0 auto; }
      .prog { margin-left:auto; font-size:12px; color:#718096; }
      .pbar { height:6px; width:70px; border-radius:4px; background:#edf2f7; overflow:hidden; margin-left:8px; flex:0 0 auto; }
      .pbar>i { display:block; height:100%; background:var(--green); }
      .dashitem { display:flex; align-items:center; gap:8px; padding:4px 0; border-top:1px dashed var(--line); font-size:14px; }
      .dashitem:first-of-type { border-top:none; }
      .dashitem.done span { color:#a0aec0; text-decoration:line-through; }
      .delx { margin-left:auto; color:#cbd5e0; cursor:pointer; padding:0 4px; }
      .delx:hover { color:var(--red); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
